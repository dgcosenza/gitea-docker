# Example Docker Compose configuration for dgcosenza/gitea
# Replace 192.0.2.10 with your host's LAN IP and pin by @sha256 digest in production.

services:
  gitea:
    image: dgcosenza/gitea:latest
    container_name: gitea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.0.2.10:3080:3000"
      - "192.0.2.10:2223:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Etc/UTC
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__START_SSH_SERVER=false
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=true
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/healthz | grep -q pass || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.10"
          memory: 256M
